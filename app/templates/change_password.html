{% extends "base.html" %}
{% block title %}Ubah Password · KasRT{% endblock %}
{% block page_title %}Ubah Password{% endblock %}
{% block content %}
<section class="card">
  <div class="card-head"><div><h2 class="card-title">Keamanan Akun</h2><p class="card-subtitle">Gunakan password minimal 10 karakter</p></div></div>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.change_password') }}" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field"><label for="current_password">Password Saat Ini</label><input id="current_password" type="password" name="current_password" autocomplete="current-password" required /></div>
    <div class="field"><label for="new_password">Password Baru</label><input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="10" required /></div>
    <button type="submit" class="btn btn-primary">Simpan Password</button>
  </form>
</section>
{% endblock %}
