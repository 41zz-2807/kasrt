<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}KasRT{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css', v=asset_version) }}" />
  </head>
  <body data-idle-timeout="{{ idle_timeout_seconds }}" data-idle-warning="{{ idle_warning_seconds }}">
    <header class="app-header">
      <strong>KasRT</strong>
      <span class="app-user">
        {{ current_user.username }} · {{ current_user.role }}
      </span>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </header>
    <main class="app-main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
            {% for category, message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <span id="idle-countdown" class="idle-countdown" aria-live="polite"></span>
    <script src="{{ url_for('static', filename='js/idle.js', v=asset_version) }}"></script>
  </body>
</html>
