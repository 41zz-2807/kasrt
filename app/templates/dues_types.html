{% extends "base.html" %}
{% block title %}Jenis Iuran · KasRT{% endblock %}
{% block content %}
<h1>Jenis Iuran</h1>
{% if error %}
  <p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('dues.dues_types_create') }}">
  {{ csrf_token() }}
  <input type="text" name="nama" placeholder="Nama jenis iuran" required />
  <label><input type="checkbox" name="is_active" value="1" /> Aktif</label>
  <button type="submit">Simpan</button>
</form>
<table>
  <thead>
    <tr><th>ID</th><th>Nama</th><th>Aktif</th></tr>
  </thead>
  <tbody>
    {% for t in dues_types %}
      <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.nama }}</td>
        <td>{{ "Ya" if t.is_active else "Tidak" }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
