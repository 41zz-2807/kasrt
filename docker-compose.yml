services:
  db:
    image: postgres:16-alpine
    container_name: kasrt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - kasrt_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kasrt-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]

  web:
    build: .
    container_name: kasrt-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "1101:8000"
    networks: [internal, webnet]

  worker:
    build: .
    container_name: kasrt-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: kasrt-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      TZ: Asia/Jakarta
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  kasrt_pgdata:

networks:
  internal:
  webnet:
    external: true
    name: war-nt-web_default
